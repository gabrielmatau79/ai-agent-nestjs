services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: ia-agent-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - agent

  ia-agent:
    build: .
    container_name: ia-agent
    depends_on:
      - redis
    env_file:
      - ./.env.docker.openai.mcp
    environment:
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - ./docs:/app/docs
    networks:
      - agent

networks:
  agent:
    driver: bridge
